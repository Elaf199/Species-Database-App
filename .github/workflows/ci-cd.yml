name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Python security scan (Safety)
        run: |
          pip install safety
          safety check --file requirements.txt --output json || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node.js dependencies
        run: |
          npm install

      - name: Run npm audit
        run: npm audit --audit-level moderate || true

      - name: Run Snyk security scan (if token available)
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements.txt --org=fbd7b7eb-23e2-443e-bd4d-cc08b4a918aa --project-name=SPECIES-DATABASE-APP

      - name: Run TruffleHog for secrets scanning
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: master
          head: HEAD
          extra_args: --debug --only-verified

  validate-repo:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # install:all also installs ReactDash's dependencies, which the root
      # build script delegates to. npm ci on its own leaves them missing.
      - name: Install dependencies
        run: npm run install:all

      - name: Build app
        run: npm run build

  deploy:
    needs: validate-repo
    runs-on: ubuntu-latest
    # deploy is left on manual trigger only. It targets /var/www/your-app and
    # restarts a pm2 process called your-app, which are the placeholders it
    # shipped with, and it needs DEPLOY_HOST, DEPLOY_USER and DEPLOY_KEY. Until
    # someone fills those in it should not fire on a push.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/your-app
            git pull
            npm ci
            npm run build
            pm2 restart your-app
